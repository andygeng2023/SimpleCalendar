/* Calendar actions, transitions, and search-result refinements */
.top-actions{display:none!important}

.panel-text-btn{min-height:38px;padding:0 12px;border:1px solid #d5e0d5;border-radius:11px;background:#fff;color:#24452c;font-size:13px;font-weight:750;white-space:nowrap;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .2s ease}

/* Professional motion layer */
:root{
  --motion-fast:180ms;
  --motion-base:260ms;
  --motion-slow:420ms;
  --ease-standard:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.2,.8,.2,1);
  --shadow-soft:0 14px 32px rgba(32,53,35,.08),0 8px 18px rgba(32,53,35,.04);
}
button,.nav-btn,.top-action,.month-controls button,.panel-text-btn,.date-cell,.date-suggestion,.event,.search-results,.empty,.modal,.toast,.calendar-scroller,.selected-panel,.day-hero,.panel,.banner,.title-field input,.field input,.field select,.field textarea{
  transition:transform var(--motion-fast) var(--ease-standard),box-shadow var(--motion-base) var(--ease-standard),background-color var(--motion-fast) ease,border-color var(--motion-fast) ease,opacity var(--motion-base) ease,filter var(--motion-base) ease;
}
button:hover,.nav-btn:hover,.top-action:hover,.month-controls button:hover,.panel-text-btn:hover,.date-suggestion:hover,
.date-cell:hover,.event:hover{transform:translateY(-1px);box-shadow:var(--shadow-soft)}

.date-cell:active,.event:active{transform:translateY(0) scale(.985)}
.nav-btn{position:relative;overflow:hidden}
.nav-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent);opacity:0;transition:opacity .2s ease}
.nav-btn:hover::after,.nav-btn.active::after{opacity:1}

@keyframes heroIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.date-cell,.search-event-list .event,.date-suggestion{animation:cardIn .26s var(--ease-soft) both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.selected-panel{will-change:transform}

.selected-panel.panel-open .panel-head,.selected-panel.panel-open #panelEvents{opacity:1;transform:translateY(0)}

@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

@keyframes modalOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(14px) scale(.98)}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

/* Quick event AI feedback */
#quickPreview{white-space:normal;overflow-wrap:anywhere;margin:10px 0 12px;padding:10px 12px;border:1px solid #dce7dc;border-radius:12px;background:#f5faf5;color:#2b4830;line-height:1.5}

/* Follow-the-handle interaction and full-timeline layout correction */
#calendarScreen:not(.panel-open) .selected-panel{position:relative;z-index:4;flex:0 0 42px;min-height:42px;overflow:visible;transform:translateY(var(--panel-drag-y,0px));will-change:transform;tran[...]

#calendarScreen:not(.panel-open) .selected-panel #panelEvents{display:none!important}

#calendarScreen.panel-open .selected-panel{transform:translateY(0);transition:transform .32s cubic-bezier(.2,.75,.25,1)}
#calendarScreen.panel-open .selected-panel .panel-head{display:flex!important}
#calendarScreen.panel-open .selected-panel #panelEvents{display:block!important}
#calendarScreen .selected-panel.is-dragging{transition:none!important}
#calendarScreen .selected-panel .handle-grip{cursor:grab;touch-action:none}
#eventForm{width:100%;min-width:0}

#eventForm .field,#eventForm .field.full{grid-column:1;min-width:0;width:100%;max-width:100%}
#eventForm .field input,#eventForm .field select,#eventForm .field textarea{width:100%;min-width:0;max-width:100%;display:block}
#eventForm .field textarea{box-sizing:border-box}
@media(min-width:600px){#eventForm .form-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:18px;row-gap:0}#eventForm .field.full{grid-column:1/-1}}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="brand">day<span>mark</span></div><div class="top-actions" aria-hidden="true"></div></header>
<main>
<section id="homeScreen" class="screen active"><div class="day-hero"><div class="weekday" id="heroWeekday">Monday</div><div class="long-date" id="heroDate"></div></div><h2 class="section-heading">Today</h2><div class="event-list" id="todayList"></div><div class="empty-state" id="todayEmpty"></div></section>
<section id="calendarScreen" class="screen"><div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input id="searchInput" type="search" placeholder="Search dates or events" aria-label="Search calendar"/></div><div class="search-results" id="searchResults"></div><div class="calendar-toolbar"><button class="month-controls" id="prevMonth" aria-label="Previous month">◀</button><h2 class="month-title" id="monthTitle"></h2><button class="month-controls" id="nextMonth" aria-label="Next month">▶</button></div><div class="calendar-grid" id="calendarGrid"></div><div class="selected-panel" id="selectedPanel"><div class="panel-handle"><div class="handle-grip"></div></div><div class="panel-head"><div class="panel-date" id="panelDate"></div><div class="panel-actions"><button class="panel-text-btn" id="panelQuick">Quick add</button><button class="panel-text-btn primary-action" id="panelAdd">Add</button></div></div><div id="panelEvents" class="panel-events"></div></div></section>
<section id="settingsScreen" class="screen settings-empty" aria-label="Settings"></section>
</main>
<nav class="bottom-nav" aria-label="Main navigation"><button class="nav-btn active" data-screen="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button><button class="nav-btn" data-screen="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></button><button class="nav-btn" data-screen="settings"><svg viewBox="0 0 24 24"><path d="M12 2.5v2.2m0 16.6v2.2M4.93 4.93l1.55 1.55m11.04 11.04 1.55 1.55M2.5 12h2.2m16.6 0h2.2M4.93 19.07l1.55-1.55m11.04-11.04 1.55-1.55M12 7.5A4.5 4.5 0 1 1 12 16.5A4.5 4.5 0 0 1 12 7.5Z"/></svg></button></nav>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-top"><h2 id="modalTitle">New event</h2><button class="icon-button" id="closeModal" aria-label="Close">✕</button></div><form id="quickForm"><textarea id="quickText" rows="3" placeholder="Describe the event… e.g. Dinner with Sam on Friday at 7pm"></textarea><div class="quick-preview" id="quickPreview"></div><button class="primary" id="quickSave" type="button">Save event</button></form><form id="eventForm" hidden><div class="form-grid"><div class="field full"><label>Title<input id="eventTitle" type="text" required></label></div><div class="field full"><label>Description<textarea id="eventDescription" rows="3"></textarea></label></div><div class="field"><label>Date<input id="eventDate" type="date" required></label></div><div class="field"><label>Location<input id="eventLocation" type="text"></label></div><div class="field"><label>Start time<input id="eventStart" type="time"></label></div><div class="field"><label>End time<input id="eventEnd" type="time"></label></div><div class="field"><label>Repeat<select id="eventRepeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label></div><div class="field"><label>Tag<input id="eventTag" type="text" placeholder="Planning, Work, Personal"></label></div><div class="field full actions"><button class="secondary" type="button" id="deleteEvent">Delete</button><button class="primary" type="submit">Save</button></div></div></form></div></div>
<div class="toast" id="toast" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'), dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}, formatDate=(d,opts={weekday:'long',day:'numeric',month:'long',year:'numeric'})=>new Intl.DateTimeFormat('en-GB',opts).format(d);
let selected=new Date(), cursor=new Date(selected), view='all', modalMode='normal', toastTimer;
const key='daymark-events-v1';
let events=[];try{events=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(events))events=[]}catch(_){events=[]}
if(!events.length){const ds=dateKey(new Date());events=[{id:crypto.randomUUID(),title:'Plan your week',date:ds,start:'09:00',end:'09:30',repeat:'none',done:false,tag:'Planning',description:'A little time to map the week ahead.'}];persist()}
function persist(){localStorage.setItem(key,JSON.stringify(events))}
function renderHome(){const now=new Date();$('heroWeekday').textContent=formatDate(now,{weekday:'long'});$('heroDate').textContent=formatDate(now,{day:'numeric',month:'long',year:'numeric'});const list=onDay(now).slice(0,3);$('todayList').innerHTML=list.length?list.map(eventMarkup).join(''):'<div class="empty">No events today</div>';bindEventActions($('todayList'));}
function onDay(d){return events.filter(e=>eventOccurs(e,d)).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
function eventOccurs(e,d){if(e.date===dateKey(d))return true;if(!e.repeat||e.repeat==='none')return false;const start=parseDate(e.date),delta=Math.round((parseDate(dateKey(d))-start)/86400000);if(delta<0)return false;switch(e.repeat){case'daily':return true;case'weekly':return delta%7===0;case'monthly':return d.getDate()===start.getDate();case'yearly':return d.getMonth()===start.getMonth()&&d.getDate()===start.getDate();default:return false}}
function eventMarkup(e){return '<article class="event '+(e.done?'done':'')+'"><input class="check" type="checkbox" aria-label="Mark '+esc(e.title)+' completed" data-check="'+e.id+'" '+(e.done?'checked':'')+'><div class="event-main"><div class="event-title">'+esc(e.title)+'</div><div class="event-meta">'+esc(timeText(e))+'</div></div><div class="event-side"><span class="tag">'+esc(e.tag||'General')+'</span><button class="edit-btn" data-edit="'+e.id+'" aria-label="Edit '+esc(e.title)+'">✎</button></div></article>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function timeText(e){if(!e.start&&!e.end)return 'All day';if(e.start&&e.end)return e.start+' – '+e.end;if(e.start)return e.start;return 'Until '+e.end}
function bindEventActions(root){root.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{const e=events.find(x=>x.id===el.dataset.check);if(e){e.done=el.checked;persist();renderHome();renderCalendar();}}));root.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>openNormal(events.find(x=>x.id===el.dataset.edit))))}
function renderCalendar(){const grid=$('calendarGrid');const firstDay=new Date(cursor.getFullYear(),cursor.getMonth(),1);const start=new Date(firstDay);start.setDate(start.getDate()-((firstDay.getDay()+6)%7));const monthDays=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);monthDays.push(d)}
$('monthTitle').textContent=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'}).format(cursor);
grid.innerHTML='';const weekdays=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];weekdays.forEach(w=>{const el=document.createElement('div');el.className='weekday-label';el.textContent=w;grid.appendChild(el);});monthDays.forEach(d=>{const btn=document.createElement('button');btn.type='button';btn.className='date-cell'+(d.getMonth()!==cursor.getMonth()?' muted':'')+(dateKey(d)===dateKey(selected)?' selected':'');btn.dataset.date=dateKey(d);btn.textContent=d.getDate();if(onDay(d).length){const dot=document.createElement('span');dot.className='dot';btn.appendChild(dot)}btn.addEventListener('click',()=>{selected=d;cursor=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar();renderPanel();renderHome();});grid.appendChild(btn);});renderPanel();}
function renderPanel(){const list=onDay(selected);$('panelDate').textContent=formatDate(selected,{weekday:'long',day:'numeric',month:'long'});$('panelEvents').innerHTML=list.length?list.map(e=>'<div class="event mini">'+esc(e.title)+'<span>'+esc(timeText(e))+'</span></div>').join(''):'<div class="empty">No events</div>'}
function switchScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===name+'Screen'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(mode){modalMode=mode;$('modalBackdrop').dataset.mode=mode;$('modalTitle').textContent=mode==='quick'?'Quick add':'New event';$('quickForm').hidden=mode!=='quick';$('eventForm').hidden=mode!=='normal';$('modalBackdrop').classList.add('open');}
function closeModal(){ $('modalBackdrop').classList.remove('open'); }
function openNormal(item){switchScreen('calendar');openModal('normal');const form=$('eventForm');form.dataset.editId=item?.id||'';$('#eventTitle').value=item?.title||'';$('#eventDescription').value=item?.description||'';$('#eventDate').value=item?.date||dateKey(selected);$('#eventLocation').value=item?.location||'';$('#eventStart').value=item?.start||'';$('#eventEnd').value=item?.end||'';$('#eventRepeat').value=item?.repeat||'none';$('#eventTag').value=item?.tag||'';$('#deleteEvent').style.display=item?'inline-block':'none';}
$('panelQuick').addEventListener('click',()=>openModal('quick'));$('panelAdd').addEventListener('click',()=>openNormal());$('closeModal').addEventListener('click',closeModal);$('#quickSave').addEventListener('click',()=>{const raw=$('#quickText').value.trim();if(!raw){showToast('Describe your event first.');return;}const event={id:crypto.randomUUID(),title:raw,date:dateKey(selected),start:'09:00',end:'09:30',repeat:'none',done:false,tag:'Quick add',description:''};events.push(event);persist();closeModal();$('#quickText').value='';renderHome();renderCalendar();showToast('Event added');});$('#eventForm').addEventListener('submit',e=>{e.preventDefault();const id=$('#eventForm').dataset.editId;const item={id:id||crypto.randomUUID(),title:$('#eventTitle').value.trim(),description:$('#eventDescription').value.trim(),date:$('#eventDate').value,location:$('#eventLocation').value.trim(),start:$('#eventStart').value,end:$('#eventEnd').value,repeat:$('#eventRepeat').value,tag:$('#eventTag').value.trim()||'General',done:false};if(!item.title||!item.date){showToast('Add a title and date.');return;}if(id){const index=events.findIndex(x=>x.id===id);if(index>=0)events[index]={...events[index],...item};}else{events.push(item);}persist();closeModal();renderHome();renderCalendar();showToast('Event saved');});$('#deleteEvent').addEventListener('click',()=>{const id=$('#eventForm').dataset.editId;if(id){events=events.filter(x=>x.id!==id);persist();closeModal();renderHome();renderCalendar();showToast('Event removed');}});document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.screen)));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('prevMonth').addEventListener('click',()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);renderCalendar();});$('nextMonth').addEventListener('click',()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);renderCalendar();});renderHome();renderCalendar();switchScreen('home');})();
</script></body></html>
