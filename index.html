(function(){

const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'), dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}, addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x}, sameDay=(a,b)=>dateKey(a)===dateKey(b), today=new Date();

const key='daymark-events-v1';
let events=[];try{events=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(events))events=[]}catch(_){events=[]}
if(!events.length){const ds=dateKey(today);events=[{id:crypto.randomUUID(),title:'Plan your week',date:ds,start:'09:00',end:'09:30',repeat:'none',done:false,tag:'Planning',description:'A little time to get organized.'},{id:crypto.randomUUID(),title:'Take a power lunch break',date:ds,start:'12:30',end:'13:15',repeat:'none',done:false,tag:'Personal',description:'Step away and recharge.'},{id:crypto.randomUUID(),title:'Check in with the team',date:ds,start:'15:00',end:'15:30',repeat:'weekly',done:true,tag:'Work',description:'Quick catch-up and progress review.'}];persist()}
function persist(){localStorage.setItem(key,JSON.stringify(events))}
function fmtDate(d,opts={weekday:'long',day:'numeric',month:'long',year:'numeric'}){return new Intl.DateTimeFormat('en-GB',opts).format(d)}
function eventOccurs(e,d){if(e.date===dateKey(d))return true;if(!e.repeat||e.repeat==='none')return false;const start=parseDate(e.date),delta=Math.round((parseDate(dateKey(d))-start)/86400000);if(delta<0)return false;if(e.repeat==='daily')return true;if(e.repeat==='weekly')return delta%7===0;if(e.repeat==='monthly')return d.getDate()===start.getDate();if(e.repeat==='yearly')return d.getMonth()===start.getMonth()&&d.getDate()===start.getDate();return false}
function onDay(d){return events.filter(e=>eventOccurs(e,d)).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
function timeText(e){if(!e.start&&!e.end)return 'All day';if(e.start&&e.end)return e.start+' – '+e.end;if(e.start)return e.start;return 'Until '+e.end}
function repeatText(r){return ({daily:'Repeats daily',weekly:'Repeats weekly',monthly:'Repeats monthly',yearly:'Repeats yearly'})[r]||''}
function eventMarkup(e){return '<article class="event '+(e.done?'done':'')+'"><input class="check" type="checkbox" aria-label="Mark '+esc(e.title)+' completed" data-check="'+e.id+'" '+(e.done?'checked':'')+'><div><div class="event-title">'+esc(e.title)+'</div><div class="event-meta">'+esc(timeText(e))+(e.location? ' • '+esc(e.location):'')+(e.repeat&&e.repeat!=='none'? ' • '+esc(repeatText(e.repeat)):'')+'</div>'+(e.tag? '<span class="tag">'+esc(e.tag)+'</span>':'')+'</div><button class="icon-btn edit-btn" data-edit="'+e.id+'" aria-label="Edit '+esc(e.title)+'" title="Edit '+esc(e.title)+'"><svg viewBox="0 0 24 24"><path d="M14 5l5 5M4 20l5-1 8-8-5-5-8 8-1 5z"/></svg></button></article>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function listMarkup(list,empty){return list.length?list.map(eventMarkup).join(''): '<div class="empty">'+empty+'</div>'}
function bindEventActions(root){root.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{const e=events.find(x=>x.id===el.dataset.check);if(e){e.done=el.checked;persist();renderAll();}}));root.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>{const e=events.find(x=>x.id===el.dataset.edit);if(e)openNormal(e);}));}
function renderHome(){const homeDay=selected;$('heroWeekday').textContent=fmtDate(homeDay,{weekday:'long'});$('heroDate').textContent=fmtDate(homeDay,{day:'numeric',month:'long',year:'numeric'});const list=onDay(homeDay), todo=list.filter(e=>!e.done), done=list.filter(e=>e.done);$('todayEvents').innerHTML='<div class="eyebrow">To do</div><div class="event-list">'+listMarkup(todo,'Nothing planned for this day.')+'</div><div class="eyebrow">Completed</div><div class="event-list">'+listMarkup(done,'Completed events will appear here.')+'</div>';bindEventActions($('todayEvents'))}
function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1,12)}
function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function makeMonth(d){const first=monthStart(d),offset=(first.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),count=Math.ceil((offset+days)/7)*7,start=addDays(first,-offset);let out='';for(let i=0;i<count;i++){const day=addDays(start,i),items=onDay(day);out += '<button class="date-cell '+(day.getMonth()!==d.getMonth()?'outside ':'')+(sameDay(day,today)?'today ':'')+(sameDay(day,selected)?'selected ':'')+'" data-date="'+dateKey(day)+'" aria-label="'+fmtDate(day,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'">'+ '<span>'+day.getDate()+'</span>' + (items.length? '<span class="dots">'+items.slice(0,3).map(()=>'<i></i>').join('')+'</span>':'') + '</button>';}return out}
function bindDateCells(root){root.querySelectorAll('[data-date]:not([data-bound])').forEach(b=>{b.dataset.bound='1';b.addEventListener('click',()=>{selected=parseDate(b.dataset.date);cursor=new Date(selected);view='month';renderAll();}));})}
function renderCalendar(){const screen=$('calendarScreen');screen.classList.toggle('panel-open',view!=='all');$('monthTitle').textContent=fmtDate(cursor,{month:'long',year:'numeric'});const grid=$('dateGrid');grid.innerHTML=makeMonth(cursor);bindDateCells(grid);renderPanel();}
function renderPanel(){ $('panelDate').textContent=fmtDate(selected,{weekday:'long',day:'numeric',month:'long'});const list=onDay(selected);$('panelEvents').innerHTML='<div class="event-list">'+listMarkup(list,'No events planned for this day.')+'</div>';bindEventActions($('panelEvents'));}
function renderAll(){renderHome();renderCalendar()}
function switchScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===name+'Screen'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));if(name==='calendar')renderCalendar();}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.screen)));
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(mode){modalMode=mode;$('modalBackdrop').dataset.mode=mode;$('modalTitle').textContent=mode==='quick'?'Quick add':'New event';$('quickForm').hidden=mode!=='quick';$('eventForm').hidden=mode!=='normal';$('modalBackdrop').classList.add('open');if(mode==='quick'){setTimeout(()=>$('quickText').focus(),80)}else if(mode==='normal'){const title=$('eventTitle');setTimeout(()=>title.focus(),80)}}
function closeModal(){$('modalBackdrop').classList.remove('open')}
function setNormalDefaults(e){$('eventTitle').value=e?.title||'';$('eventDescription').value=e?.description||'';$('eventDate').value=e?.date||dateKey(selected);$('eventLocation').value=e?.location||'';$('eventStart').value=e?.start||'';$('eventEnd').value=e?.end||'';$('eventRepeat').value=e?.repeat||'none';$('eventPeople').value=e?.people||'';$('eventNotes').value=e?.notes||'';$('eventForm').dataset.editId=e?.id||''}
function openNormal(e){switchScreen('calendar');openModal('normal');setNormalDefaults(e);$('modalTitle').textContent=e?'Edit event':'New event';if(e){const old=$('eventForm').querySelector('.delete-event');if(old)old.remove();const btn=document.createElement('button');btn.type='button';btn.className='secondary delete-event';btn.textContent='Delete event';btn.style.marginTop='12px';btn.addEventListener('click',()=>{if(confirm('Delete this event?')){events=events.filter(x=>x.id!==e.id);persist();closeModal();renderAll();showToast('Event deleted');}});$('eventForm').appendChild(btn);}else{$('eventForm').querySelector('.delete-event')?.remove();}}
$('panelQuick').addEventListener('click',()=>openModal('quick'));$('panelAdd').addEventListener('click',()=>openNormal());$('closeModal').addEventListener('click',closeModal);$('modalBackdrop').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
function parseNatural(raw){let s=raw.trim(),title=s,date=new Date(selected),start='',end='',repeat='none',explicitDate=false;const now=new Date();function setDate(d){date=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);explicitDate=true}let m;if((m=s.match(/\b(today|tomorrow|day after tomorrow)\b/i))){setDate(addDays(now,/day after tomorrow/i.test(m[0])?2:/tomorrow/i.test(m[0])?1:0));title=title.replace(m[0],' ')}
if((m=s.match(/\b(on\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)(?:\s+(\d{4}))?\b/i))){const monthMap={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};const y=Number(m[3]||now.getFullYear());const mo=monthMap[m[2].slice(0,3).toLowerCase()];setDate(new Date(y,mo,Number(m[1]),12));title=title.replace(m[0],' ')}
const tm=/((?:[01]?\d|2[0-3])(?::[0-5]\d)?\s*(?:am|pm)?)\s*(?:to|until|[-–])\s*((?:[01]?\d|2[0-3])(?::[0-5]\d)?\s*(?:am|pm)?)\b/i.exec(s);function norm(t){let z=t.toLowerCase().replace(/\s/g,'');let ap=z.match(/(am|pm)$/);z=z.replace(/(am|pm)$/,'');let p=z.split(':'),h=Number(p[0]),min=Number(p[1]||0);if(ap){if(ap[1]==='pm'&&h<12)h+=12;if(ap[1]==='am'&&h===12)h=0}return pad(h)+':'+pad(min)}
if(tm){start=norm(tm[1]);end=norm(tm[2]);title=title.replace(tm[0],' ')}else if((m=s.match(/\b(?:at\s*)?(\d{1,2})(?::([0-5]\d))?\s*(am|pm)\b/i))){start=norm(m[1]+':'+(m[2]||'00')+' '+m[3]);title=title.replace(m[0],' ')}
if(/\bevery\s+day\b|\bdaily\b/i.test(s)){repeat='daily';title=title.replace(/\b(every\s+day|daily)\b/i,' ')}else if(/\bevery\s+week\b|\bweekly\b|\bevery\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.test(s)){repeat='weekly';title=title.replace(/\b(every\s+week|weekly|every\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday))\b/i,' ')}else if(/\bevery\s+month\b|\bmonthly\b/i.test(s)){repeat='monthly';title=title.replace(/\b(every\s+month|monthly)\b/i,' ')}else if(/\bevery\s+year\b|\byearly\b/i.test(s)){repeat='yearly';title=title.replace(/\b(every\s+year|yearly)\b/i,' ')}
title=title.replace(/\b(on|at)\b/gi,' ').replace(/[,.]+/g,' ').replace(/\s+/g,' ').trim();if(!title)title=raw.trim();return {title,date:dateKey(date),start,end,repeat,tag:repeat!=='none'?'Repeating':'Timed'}
}
const VIREONIX_ENDPOINT='https://amquosuyqcyyinjhvuow.supabase.co/functions/v1/vireonix-chat';
let quickParseTimer=null,quickParseRequest=0,quickAiResult=null;
function localDateString(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function normalizeAiEvent(data,raw){
  if(!data||typeof data!=='object')throw new Error('Invalid event structure');
  const local=parseNatural(raw);
  const clean=(v,max=500)=>typeof v==='string'?v.trim().slice(0,max):'';
  let date=clean(data.date,20);if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date))date='';if(date){const parsed=parseDate(date);if(!parsed||Number.isNaN(parsed.getTime())||dateKey(parsed)!==date)date=''}
  const time=v=>{v=clean(v,20);if(!v)return '';if(/^\d{1,2}:\d{2}$/.test(v)){const [h,m]=v.split(':').map(Number);return h<24&&m<60?pad(h)+':'+pad(m):''}const m=v.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);if(!m)return '';let h=Number(m[1]),min=Number(m[2]||0);if(m[3]){if(m[3].toLowerCase()==='pm'&&h<12)h+=12;if(m[3].toLowerCase()==='am'&&h===12)h=0}return h<24&&min<60?pad(h)+':'+pad(min):''};
  let repeat=clean(data.repeat,30).toLowerCase();if(!['none','daily','weekly','monthly','yearly'].includes(repeat)){if(/daily|every day/i.test(repeat))repeat='daily';else if(/weekly|every week|every (monday|tuesday|wednesday|thursday|friday|saturday|sunday)/i.test(repeat))repeat='weekly';else if(/monthly|every month/i.test(repeat))repeat='monthly';else if(/yearly|every year|annual/i.test(repeat))repeat='yearly';else repeat='none';}
  let title=clean(data.title,180);const genericTitle=/^(meeting|event|appointment|task|reminder|calendar event|new event)$/i.test(title);if(!title||genericTitle||(/\bfamily time\b/i.test(title)&&!/\w/.test(raw)))title=local.title||'Event';
  return {title,description:clean(data.description,2000),date:date||local.date||dateKey(selected),start:time(data.start)||local.start,end:time(data.end)||local.end,repeat,location:clean(data.location,300),people:clean(data.people,300),notes:clean(data.notes,2000),tag:repeat!=='none'?'Repeating':'Timed'};
}
async function parseWithVireonix(raw){
  const today=localDateString(),selectedDay=dateKey(selected);
  const prompt='Extract a calendar event from the user text. Return ONLY one valid JSON object, no markdown or commentary, with exactly these fields: title, description, date, start, end, repeat, location, people, notes. Use a YYYY-MM-DD date. Use start/end as HH:MM time strings or empty strings. Use repeat as one of none,daily,weekly,monthly,yearly. Use empty strings for absent optional values. Keep the specific event name from the user text. User text: '+raw+' Today is '+today+'. Selected calendar date is '+selectedDay+'.';
  const response=await fetch(VIREONIX_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'text/event-stream, application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]})});
  if(!response.ok)throw new Error('VireonixAI request failed (HTTP '+response.status+')');
  const type=response.headers.get('content-type')||'';let answer='';
  if(!response.body||!type.includes('text/event-stream')){const body=await response.json();answer=body?.choices?.[0]?.message?.content||body?.output_text||''}
  else{
   const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';
   while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const parts=buffer.split(/\n\n/);buffer=parts.pop()||'';for(const part of parts){const line=part.trim();if(!line.startsWith('data:'))continue;const payload=line.slice(5).trim();if(!payload||payload==='[DONE]')continue;try{const chunk=JSON.parse(payload);answer += chunk?.choices?.[0]?.delta?.content || '';}catch(_){} }}
  }
  if(!answer.trim())throw new Error('VireonixAI returned no event data');
  const cleaned=answer.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
  const parsed=JSON.parse(cleaned);
  return normalizeAiEvent(parsed,raw);
}
function showQuickPreview(p,prefix='Preview'){
  $('quickPreview').textContent=prefix+': '+p.title+' · '+fmtDate(parseDate(p.date),{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' · '+(p.start?(p.start+(p.end?'–'+p.end:'')):'All day')+(p.repeat&&p.repeat!=='none'?' · '+repeatText(p.repeat):'');
}
$('quickText').addEventListener('input',()=>{
  const raw=$('quickText').value.trim();quickAiResult=null;clearTimeout(quickParseTimer);const request=++quickParseRequest;
  if(!raw){$('quickPreview').textContent='';return}
  showQuickPreview(parseNatural(raw),'Local preview');
  quickParseTimer=setTimeout(async()=>{
   if(raw!==$('quickText').value.trim())return;
   $('quickPreview').textContent='Interpreting event details with VireonixAI…';
   try{const p=await parseWithVireonix(raw);if(request!==quickParseRequest||raw!==$('quickText').value.trim())return;quickAiResult={raw,event:p};showQuickPreview(p,'VireonixAI')}
   catch(error){if(request!==quickParseRequest)return;$('quickPreview').textContent='AI parsing unavailable; local preview shown. '+$('quickPreview').textContent.replace(/^Local preview: /,'')}
  },650);
});
$('quickSave').addEventListener('click',async()=>{
  const raw=$('quickText').value.trim();if(!raw){showToast('Describe your event first.');return}
  const btn=$('quickSave');btn.disabled=true;btn.setAttribute('aria-busy','true');
  try{
   let p;if(quickAiResult?.raw===raw)p=quickAiResult.event;else{ $('quickPreview').textContent='Interpreting event details…';try{p=await parseWithVireonix(raw)}catch(error){p=parseNatural(raw);showToast('AI unavailable; local parsing used.')}
   }
   if(!p.title||!p.date){showToast('Add an event name and date.');return}
   events.push({id:crypto.randomUUID(),...p,done:false,description:p.description||'',location:p.location||'',people:p.people||'',notes:p.notes||''});
   persist();selected=parseDate(p.date);cursor=new Date(selected);view='month';closeModal();renderAll();switchScreen('calendar');showToast('Event added');
  }finally{btn.disabled=false;btn.removeAttribute('aria-busy')}
});
$('eventForm').addEventListener('submit',e=>{e.preventDefault();const id=$('eventForm').dataset.editId;const old=events.find(x=>x.id===id);const item={id:id||crypto.randomUUID(),title:$('eventTitle').value.trim(),description:$('eventDescription').value.trim(),date:$('eventDate').value,start:$('eventStart').value,end:$('eventEnd').value,repeat:$('eventRepeat').value,location:$('eventLocation').value.trim(),people:$('eventPeople').value.trim(),notes:$('eventNotes').value.trim(),done:old?.done||false,tag:$('eventRepeat').value!=='none'?'Repeating':'Timed'};if(!item.title||!item.date)return;if(id)events=events.map(x=>x.id===id?item:x);else events.push(item);persist();selected=parseDate(item.date);cursor=new Date(selected);view='month';closeModal();renderAll();switchScreen('calendar');showToast(id?'Event updated':'Event added');$('eventForm').dataset.editId='';});
['prevYear','nextYear','prevMonth','nextMonth'].forEach(id=>$(id).addEventListener('click',()=>{const amount=id==='prevYear'?-12:id==='nextYear'?12:id==='prevMonth'?-1:1;cursor=new Date(cursor.getFullYear(),cursor.getMonth()+amount,1,12);renderCalendar();}));
$('searchInput').addEventListener('input',()=>{const raw=$('searchInput').value.trim(),q=raw.toLowerCase(),root=$('searchResults');root.innerHTML='';if(!q)return;const parsed=new Date(raw),exactDate=/^\d{4}-\d{2}-\d{2}$/.test(raw)?parseDate(raw):(!Number.isNaN(parsed.getTime())&&raw.length>5?new Date(parsed.getFullYear(),parsed.getMonth(),parsed.getDate(),12):null);const dateSet=new Map();events.forEach(e=>{const d=parseDate(e.date),label=fmtDate(d,{month:'long',day:'numeric',year:'numeric'});if(label.toLowerCase().includes(q)||e.date.includes(q))dateSet.set(e.date,d);});if(dateSet.size){const heading=document.createElement('div');heading.className='search-section-label';heading.textContent='Dates';root.appendChild(heading);const dates=document.createElement('div');dates.className='date-suggestions';Array.from(dateSet.values()).sort((a,b)=>a-b).slice(0,8).forEach(d=>{const b=document.createElement('button');b.type='button';b.className='date-suggestion';b.innerHTML='<span>'+fmtDate(d,{month:'long',day:'numeric',year:'numeric'})+'</span><span class="suggestion-weekday">'+fmtDate(d,{weekday:'long'})+'</span>';b.addEventListener('click',()=>{selected=new Date(d);cursor=new Date(d);view='month';renderAll();switchScreen('calendar');$('searchInput').value='';root.innerHTML='';});dates.appendChild(b);});root.appendChild(dates)}
const matches=events.filter(e=>(e.title+' '+e.description+' '+e.location+' '+e.date+' '+fmtDate(parseDate(e.date),{weekday:'long',day:'numeric',month:'long',year:'numeric'})).toLowerCase().includes(q)).slice(0,20);if(matches.length){const h=document.createElement('div');h.className='search-section-label';h.textContent='Events';root.appendChild(h);const list=document.createElement('div');list.className='search-event-list';list.innerHTML=matches.map(e=>eventMarkup(e)).join('');bindEventActions(list);root.appendChild(list)}});
let handleY=0,handleX=0,handleLastY=0,handleStartView='all';const handle=$('selectedPanel').querySelector('.handle-grip'),selectedPanel=$('selectedPanel');handle.addEventListener('pointerdown',e=>{handleY=e.clientY;handleX=e.clientX;handleLastY=e.clientY;handleStartView=view;selectedPanel.classList.add('is-dragging');handle.classList.add('dragging');handle.setPointerCapture(e.pointerId);});handle.addEventListener('pointermove',e=>{if(!selectedPanel.classList.contains('is-dragging'))return;const dy=e.clientY-handleY;const max=140;const clamped=Math.max(-max,Math.min(max,dy));selectedPanel.style.setProperty('--panel-drag-y',clamped+'px');});handle.addEventListener('pointerup',()=>{selectedPanel.classList.remove('is-dragging');handle.classList.remove('dragging');const dy=parseFloat(selectedPanel.style.getPropertyValue('--panel-drag-y'))||0;selectedPanel.style.removeProperty('--panel-drag-y');view = Math.abs(dy) > 60 ? (dy < 0 ? 'month' : 'all') : handleStartView;renderCalendar();});
