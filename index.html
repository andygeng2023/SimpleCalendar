/* Calendar actions, transitions, and search-result refinements */
.top-actions{display:none!important}
#calendarScreen .panel-head{align-items:center;gap:8px}
#calendarScreen .panel-actions{margin-left:auto;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.panel-text-btn{min-height:38px;padding:0 12px;border:1px solid #d5e0d5;border-radius:11px;background:#fff;color:#24452c;font-size:13px;font-weight:750;white-space:nowrap;transition:background .16s,transform .16s}
.panel-text-btn.primary-action{background:var(--green);border-color:var(--green);color:#fff}
.panel-text-btn:active{transform:scale(.96)}
.search-results{display:flex;flex-direction:column;gap:4px;max-height:36%;overflow-y:auto;overscroll-behavior:contain}
.search-section-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5a6a5c;margin:8px 0 2px}
.date-suggestions{display:flex;flex-direction:column;gap:4px}
.date-suggestion{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid #dce5dc;border-radius:10px;background:#fff;padding:8px 11px;color:#203624;font-size:13px;font-weight:700;min-height:38px}
.date-suggestion:active{background:#eaf4eb}
.suggestion-weekday{font-size:11px;color:#637365;font-weight:550}
.search-event-list .event{grid-template-columns:18px minmax(0,1fr) auto;gap:8px;padding:7px 9px;margin:0 0 5px;border:1px solid #e0e7df;border-radius:10px;background:#fff}
.search-event-list .check{width:17px;height:17px;margin-top:2px;border-radius:5px}
.search-event-list .event-title{font-size:13px;line-height:1.25}
.search-event-list .event-meta{font-size:11px;line-height:1.35;margin-top:3px}
.search-event-list .tag{font-size:10px;padding:2px 6px;margin-top:4px}
.search-event-list .edit-btn{width:27px!important;height:27px!important;min-height:27px;border-radius:8px}
.search-event-date{font-size:11px;color:#536654;font-weight:750;margin:7px 2px 3px}
.screen.active{animation:screenEnter .24s cubic-bezier(.2,.75,.25,1) both}
@keyframes screenEnter{from{opacity:.55;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.calendar-scroller.view-enter{animation:viewEnter .34s cubic-bezier(.2,.75,.25,1) both}#calendarScreen .panel-head,#calendarScreen .panel-actions,.month-controls button{transition:opacity .22s ease,transform .28s cubic-bezier(.2,.75,.25,1)}.date-cell{transition:background-color .2s ease,color .2s ease,transform .24s cubic-bezier(.2,.75,.25,1)}.date-cell:active{transform:scale(.91)}
#calendarScreen .search-wrap:has(+ #searchResults:not(:empty)){margin-bottom:3px}
@media(max-width:430px){.panel-text-btn{font-size:12px;padding:0 9px;min-height:36px}.panel-head h2{font-size:17px}.search-results{max-height:32%}.search-event-list .event{padding:6px 7px}}
@media(prefers-reduced-motion:reduce){.screen.active,.calendar-scroller.view-enter,.timeline-month{animation:none!important;transition:none!important}}

/* Quick event AI feedback */
#quickPreview{white-space:normal;overflow-wrap:anywhere;margin:10px 0 12px;padding:10px 12px;border:1px solid #dce7dc;border-radius:12px;background:#f5faf5;color:#2b4830;line-height:1.5}
#quickSave[disabled]{opacity:.65;cursor:wait}

/* Follow-the-handle interaction and full-timeline layout correction */
/* Layout-based drag preview: calendar space responds continuously to pointer movement. */
#calendarScreen.is-view-dragging .selected-panel,
#calendarScreen.is-view-dragging .calendar-scroller,
#calendarScreen.is-view-dragging .date-cell,
#calendarScreen.is-view-dragging .panel-head,
#calendarScreen.is-view-dragging .panel-actions,
#calendarScreen.is-view-dragging .handle-grip{transition:none!important}
#calendarScreen.is-view-dragging:not(.panel-open) .selected-panel{position:relative;z-index:4;flex:0 0 calc(42px + var(--drag-panel-size,0px));min-height:42px;transform:none!important;overflow:hidden}
#calendarScreen.is-view-dragging:not(.panel-open) .selected-panel .panel-head{display:flex!important;opacity:var(--drag-progress,0);pointer-events:none}
#calendarScreen.is-view-dragging:not(.panel-open) .selected-panel #panelEvents{display:block!important;opacity:var(--drag-progress,0);pointer-events:none}

<script>
