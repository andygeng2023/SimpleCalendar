<style>

.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px;flex:0 0 auto}.month-title{font-size:23px;font-weight:760;letter-spacing:-.8px}.month-controls{display:flex;align-items:center;gap:4px}.month-controls button{border:0;background:white;color:#4e564d;width:32px;height:34px;border-radius:9px;font-size:0;display:grid;place-items:center;transition:background .16s,transform .16s}.month-controls button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.month-controls button:active{transform:scale(.88)}.month-controls button:hover{background:var(--green-pale)}.search-wrap{position:relative;margin:0 0 8px;flex:0 0 auto}.search-wrap svg{position:absolute;left:14px;top:13px;width:18px;color:var(--muted)}.search{width:100%;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:13px;padding:0 14px 0 42px;font-size:14px}.weekdays,.date-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.weekdays{padding:0 0 9px;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:2}.weekdays span{font-size:11px;color:var(--muted);font-weight:700;padding:7px 0}.date-grid{row-gap:2px;padding:5px 0 6px}.timeline-month{padding:8px 0 14px;animation:monthIn .22s ease both}.timeline-title{font-size:17px;font-weight:750;letter-spacing:-.35px;text-align:left;margin:5px 0 7px}.timeline-month .date-grid{padding:0;row-gap:3px}.timeline-month .date-cell{height:clamp(34px,6.3dvh,52px)}@keyframes monthIn{from{opacity:.45;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.date-cell{height:clamp(30px,5.2dvh,46px);border:0;background:white;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink);font-size:14px;position:relative}.date-cell.outside{color:#c2c8c0}.date-cell.today:not(.selected){box-shadow:inset 0 0 0 1.5px var(--green)}.date <body><div class="app">
<header class="topbar"><div class="brand">day<span>mark</span></div><button class="icon-btn" id="quickAdd" aria-label="Quick add event" title="Quick add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></header>
<main>

</main>
<nav class="bottom-nav" aria-label="Main navigation"><button class="nav-btn active" data-screen="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button><button class="nav-btn" data-screen="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Calendar</span></button><button class="nav-btn" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.8 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.7-1.4-2.4L7.1 15a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.8-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.8 1l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1-.3 2z" transform="translate(-1 -1)"/></svg><span>Settings</span></button></nav>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-top"><h2 id="modalTitle">New event</h2><button class="close-btn" id="closeModal" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="quickForm"><div class="field"><label for="quickText">Describe your event</label><textarea id="quickText" placeholder="e.g. Dentist tomorrow at 10:07 to 11am, repeat weekly"></textarea></div><p class="nlp-help">Try “Team meeting tomorrow 10:07 to 20:00”, “Gym every Monday at 6pm”, or “Lunch on 14 June at noon”. We’ll interpret common dates, times and repeats.</p><div id="quickPreview" class="nlp-help"></div><button class="primary icon-only" id="quickSave" aria-label="Create event" title="Create event"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button></div><form id="eventForm" hidden><div class="form-grid"><div class="field full"><label for="eventTitle">Title *</label><input id="eventTitle" required placeholder="Event name"></div><div class="field full"><label for="eventDescription">Description</label><textarea id="eventDescription" placeholder="What is this event about?"></textarea></div><div class="field"><label for="eventDate">Date *</label><input id="eventDate" type="date" required></div><div class="field"><label for="eventLocation">Location</label><input id="eventLocation" placeholder="Add a place"></div><div class="field"><label for="eventStart">Start time</label><input id="eventStart" type="time"></div><div class="field"><label for="eventEnd">End time</label><input id="eventEnd" type="time"></div><div class="field"><label for="eventRepeat">Repeat</label><select id="eventRepeat"><option value="none">Never</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option><option value="yearly">Every year</option></select></div><div class="field"><label for="eventPeople">People</label><input id="eventPeople" placeholder="Names, separated by commas"></div><div class="field full"><label for="eventNotes">Notes</label><textarea id="eventNotes" placeholder="Anything else to remember"></textarea></div></div><button class="primary icon-only" type="submit" aria-label="Save event" title="Save event"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button></form></div></div><div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'), dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}, addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x}, sameDay=(a,b)=>dateKey(a)===dateKey(b), today=new Date();
let selected=new Date(today.getFullYear(),today.getMonth(),today.getDate(),12), cursor=new Date(selected), view='all', modalMode='normal', toastTimer;
const key='daymark-events-v1';
let events=[];try{events=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(events))events=[]}catch(_){events=[]}
if(!events.length){const ds=dateKey(today);events=[{id:crypto.randomUUID(),title:'Plan your week',date:ds,start:'09:00',end:'09:30',repeat:'none',done:false,tag:'Planning',description:'A little time to get organised.'},{id:crypto.randomUUID(),title:'Take a proper lunch break',date:ds,start:'12:30',end:'13:15',repeat:'none',done:false,tag:'Personal'},{id:crypto.randomUUID(),title:'Check in with the team',date:ds,start:'15:00',end:'15:30',repeat:'weekly',done:true,tag:'Work'}];persist()}
function persist(){localStorage.setItem(key,JSON.stringify(events))}
function fmtDate(d,opts={weekday:'long',day:'numeric',month:'long',year:'numeric'}){return new Intl.DateTimeFormat('en-GB',opts).format(d)}
function eventOccurs(e,d){if(e.date===dateKey(d))return true;if(!e.repeat||e.repeat==='none')return false;const start=parseDate(e.date),delta=Math.round((parseDate(dateKey(d))-start)/86400000);if(delta<0)return false;if(e.repeat==='daily')return true;if(e.repeat==='weekly')return delta%7===0;if(e.repeat==='monthly')return d.getDate()===start.getDate();if(e.repeat==='yearly')return d.getDate()===start.getDate()&&d.getMonth()===start.getMonth();return false}
function onDay(d){return events.filter(e=>eventOccurs(e,d)).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
function timeText(e){if(!e.start&&!e.end)return 'All day';if(e.start&&e.end)return e.start+' – '+e.end;if(e.start)return e.start;return 'Until '+e.end}
function repeatText(r){return ({daily:'Repeats daily',weekly:'Repeats weekly',monthly:'Repeats monthly',yearly:'Repeats yearly'})[r]||''}
function eventMarkup(e){return '<article class="event '+(e.done?'done':'')+'"><input class="check" type="checkbox" aria-label="Mark '+esc(e.title)+' completed" data-check="'+e.id+'" '+(e.done?'checked':'')+'><div><div class="event-title">'+esc(e.title)+'</div><div class="event-meta">'+esc(timeText(e))+(e.location?' · '+esc(e.location):'')+(repeatText(e.repeat)?'<br>'+repeatText(e.repeat):'')+(e.description?'<br>'+esc(e.description):'')+(e.people?'<br>With '+esc(e.people):'')+'</div>'+(e.tag?'<span class="tag">'+esc(e.tag)+'</span>':'')+'</div><button class="icon-btn edit-btn" data-edit="'+e.id+'" aria-label="Edit '+esc(e.title)+'" style="width:32px;height:32px;border:0"><svg viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16z"/></svg></button></article>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function listMarkup(list,empty){return list.length?list.map(eventMarkup).join(''):'<div class="empty">'+empty+'</div>'}
function bindEventActions(root){root.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{const e=events.find(x=>x.id===el.dataset.check);if(e){e.done=el.checked;persist();renderAll()}}));root.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>openNormal(events.find(x=>x.id===el.dataset.edit))))}
function renderHome(){ $('heroWeekday').textContent=fmtDate(today,{weekday:'long'});$('heroDate').textContent=fmtDate(today,{day:'numeric',month:'long',year:'numeric'});const list=onDay(today),todo=list.filter(e=>!e.done),done=list.filter(e=>e.done);$('todayEvents').innerHTML='<div class="eyebrow">To do · '+todo.length+'</div><div class="event-list">'+listMarkup(todo,'Nothing to do yet. Enjoy the breathing room.')+'</div><div class="eyebrow">Completed · '+done.length+'</div><div class="event-list">'+listMarkup(done,'Completed events will appear here.')+'</div>';bindEventActions($('todayEvents'))}
function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1,12)}
function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function makeMonth(d){const first=monthStart(d),offset=(first.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),count=Math.ceil((offset+days)/7)*7,start=addDays(first,-offset);let out='<section class="timeline-month" data-month="'+monthKey(first)+'"><div class="timeline-title">'+esc(fmtDate(first,{month:'long',year:'numeric'}))+'</div><div class="date-grid">';for(let i=0;i<count;i++){const day=addDays(start,i),items=onDay(day);out+='<button class="date-cell '+(day.getMonth()!==first.getMonth()?'outside ':'')+(sameDay(day,today)?'today ':'')+(sameDay(day,selected)?'selected':'')+'" data-date="'+dateKey(day)+'" aria-label="'+esc(fmtDate(day))+(items.length?', '+items.length+' events':'')+'"><span>'+day.getDate()+'</span><span class="dots">'+items.slice(0,3).map(()=>'<i></i>').join('')+'</span></button>'}return out+'</div></section>'}
function bindDateCells(root){root.querySelectorAll('[data-date]:not([data-bound])').forEach(b=>{b.dataset.bound='1';b.addEventListener('click',()=>{selected=parseDate(b.dataset.date);cursor=new Date(selected);renderCalendar();renderPanel()})})}
function renderCalendar(){const screen=$('calendarScreen');screen.classList.toggle('panel-open',view!=='all');$('monthTitle').textContent=fmtDate(cursor,{month:'long',year:'numeric'});const sc=$('calendarScroller'),grid=$('dateGrid');sc.className='calendar-scroller '+(view==='week'?'week-mode':view==='month'?'month-mode':'');if(view==='all'){grid.innerHTML='';const start=new Date(cursor.getFullYear(),cursor.getMonth()-6,1,12);for(let i=0;i<13;i++)grid.insertAdjacentHTML('beforeend',makeMonth(new Date(start.getFullYear(),start.getMonth()+i,1,12)));bindDateCells(grid);requestAnimationFrame(()=>{const target=grid.querySelector('[data-month="'+monthKey(cursor)+'"]');if(target)sc.scrollTop=target.offsetTop-grid.offsetTop});}else{grid.style.display='grid';const first=monthStart(cursor);let start;if(view==='week'){start=new Date(selected);start=addDays(start,-((start.getDay()+6)%7))}else start=addDays(first,-((first.getDay()+6)%7));const count=view==='week'?7:42;let out='';for(let i=0;i<count;i++){const d=addDays(start,i),inside=d.getMonth()===cursor.getMonth(),items=onDay(d);out+='<button class="date-cell '+(!inside&&view!=='week'?'outside ':'')+(sameDay(d,today)?'today ':'')+(sameDay(d,selected)?'selected':'')+'" data-date="'+dateKey(d)+'" aria-label="'+esc(fmtDate(d))+(items.length?', '+items.length+' events':'')+'"><span>'+d.getDate()+'</span><span class="dots">'+items.slice(0,3).map(()=>'<i></i>').join('')+'</span></button>'}grid.innerHTML=out;bindDateCells(grid)}renderPanel()}
function renderPanel(){ $('panelDate').textContent=fmtDate(selected,{weekday:'long',day:'numeric',month:'long'});const list=onDay(selected);$('panelEvents').innerHTML='<div class="event-list">'+listMarkup(list,'No events planned for this day.')+'</div>';bindEventActions($('panelEvents'))}
function renderAll(){renderHome();renderCalendar()}
function switchScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===name+'Screen'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));if(name==='calendar')renderCalendar()}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.screen)));
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(mode){modalMode=mode;$('modalTitle').textContent=mode==='quick'?'Quick add':'New event';$('quickForm').hidden=mode!=='quick';$('eventForm').hidden=mode==='quick';$('modalBackdrop').classList.add('open');if(mode==='quick'){$('quickText').value='';$('quickPreview').textContent='';setTimeout(()=>$('quickText').focus(),100)}else if(!$('eventTitle').value)setNormalDefaults()}
function closeModal(){$('modalBackdrop').classList.remove('open')}
function setNormalDefaults(e){$('eventTitle').value=e?.title||'';$('eventDescription').value=e?.description||'';$('eventDate').value=e?.date||dateKey(selected);$('eventLocation').value=e?.location||'';$('eventStart').value=e?.start||'';$('eventEnd').value=e?.end||'';$('eventRepeat').value=e?.repeat||'none';$('eventPeople').value=e?.people||'';$('eventNotes').value=e?.notes||'';$('eventForm').dataset.editId=e?.id||''}
function openNormal(e){switchScreen('calendar');openModal('normal');setNormalDefaults(e);$('modalTitle').textContent=e?'Edit event':'New event';if(e){const old=$('eventForm').querySelector('.delete-event');if(old)old.remove();const del=document.createElement('button');del.type='button';del.className='secondary delete-event';del.innerHTML='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>';del.setAttribute('aria-label','Delete event');del.title='Delete event';del.style.cssText='width:48px;height:44px;display:grid;place-items:center;margin:10px 0 0 auto;padding:0';del.onclick=()=>{if(confirm('Delete this event?')){events=events.filter(x=>x.id!==e.id);persist();closeModal();renderAll();showToast('Event deleted')}};$('eventForm').appendChild(del)}else{$('eventForm').querySelector('.delete-event')?.remove()}}
$('quickAdd').addEventListener('click',()=>openModal('quick'));$('panelQuick').addEventListener('click',()=>openModal('quick'));$('panelAdd').addEventListener('click',()=>openNormal());$('closeModal').addEventListener('click',closeModal);$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});
function parseNatural(raw){let s=raw.trim(),title=s,date=new Date(selected),start='',end='',repeat='none',explicitDate=false;const now=new Date();function setDate(d){date=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);explicitDate=true}
let m;if((m=s.match(/\b(today|tomorrow|day after tomorrow)\b/i))){setDate(addDays(now,/day after tomorrow/i.test(m[0])?2:/tomorrow/i.test(m[0])?1:0));title=title.replace(m[0],' ')}
if((m=s.match(/\b(on\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)(?:\s+(\d{4}))?\b/i))){const months=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'],mo=months.indexOf(m[3].slice(0,3).toLowerCase()),yr=Number(m[4]||now.getFullYear());setDate(new Date(yr,mo,Number(m[2]),12));if(!m[4]&&date<new Date(now.getFullYear(),now.getMonth(),now.getDate(),12))date.setFullYear(date.getFullYear()+1);title=title.replace(m[0],' ')}
const tm=/(\b(?:[01]?\d|2[0-3])(?::[0-5]\d)?\s*(?:am|pm)?)\s*(?:to|until|[-–])\s*(\b(?:[01]?\d|2[0-3])(?::[0-5]\d)?\s*(?:am|pm)?)\b/i.exec(s);
function norm(t,other){let z=t.toLowerCase().replace(/\s/g,'');let ap=z.match(/(am|pm)$/);z=z.replace(/(am|pm)$/,'');let p=z.split(':'),h=Number(p[0]),min=Number(p[1]||0);if(ap){if(ap[1]==='pm'&&h<12)h+=12;if(ap[1]==='am'&&h===12)h=0}else if(other){const oa=other.toLowerCase().replace(/\s/g,'').match(/(am|pm)$/);if(oa){if(oa[1]==='pm'&&h<12)h+=12;if(oa[1]==='am'&&h===12)h=0}}return pad(h)+':'+pad(min)}
if(tm){start=norm(tm[1],tm[2]);end=norm(tm[2],tm[1]);title=title.replace(tm[0],' ')}else if((m=s.match(/\b(?:at\s*)?(\d{1,2})(?::([0-5]\d))?\s*(am|pm)\b/i))){let h=Number(m[1]),min=Number(m[2]||0);if(m[3].toLowerCase()==='pm'&&h<12)h+=12;if(m[3].toLowerCase()==='am'&&h===12)h=0;start=pad(h)+':'+pad(min);title=title.replace(m[0],' ')}else if(/\bnoon\b/i.test(s)){start='12:00';title=title.replace(/\bnoon\b/i,' ')}else if(/\bmidnight\b/i.test(s)){start='00:00';title=title.replace(/\bmidnight\b/i,' ')}
if(/\bevery\s+day\b|\bdaily\b/i.test(s)){repeat='daily';title=title.replace(/\b(every\s+day|daily)\b/i,' ')}else if(/\bevery\s+week|\bweekly\b|\bevery\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.test(s)){repeat='weekly';title=title.replace(/\b(every\s+week|weekly|every\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday))\b/i,' ')}else if(/\bevery\s+month|\bmonthly\b/i.test(s)){repeat='monthly';title=title.replace(/\b(every\s+month|monthly)\b/i,' ')}else if(/\bevery\s+year|\byearly\b|\bannually\b/i.test(s)){repeat='yearly';title=title.replace(/\b(every\s+year|yearly|annually)\b/i,' ')}
title=title.replace(/\b(on|at)\b/gi,' ').replace(/[,.]+/g,' ').replace(/\s+/g,' ').trim();if(!title)title=raw.trim();return {title,date:dateKey(date),start,end,repeat,tag:repeat!=='none'?'Repeating':start?'Timed':'All day'}}
$('quickText').addEventListener('input',()=>{const raw=$('quickText').value;if(!raw.trim()){$('quickPreview').textContent='';return}const p=parseNatural(raw);$('quickPreview').textContent='Preview: '+p.title+' · '+fmtDate(parseDate(p.date),{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' · '+(p.start?(p.start+(p.end?'–'+p.end:'')):'All day')+(p.repeat!=='none'?' · '+repeatText(p.repeat):'')});
$('quickSave').addEventListener('click',()=>{const raw=$('quickText').value.trim();if(!raw){showToast('Describe your event first.');return}const p=parseNatural(raw);events.push({id:crypto.randomUUID(),...p,done:false,description:'',location:'',people:'',notes:''});persist();selected=parseDate(p.date);cursor=new Date(selected);closeModal();renderAll();switchScreen('calendar');showToast('Event added')});
$('eventForm').addEventListener('submit',e=>{e.preventDefault();const id=$('eventForm').dataset.editId;const old=events.find(x=>x.id===id);const item={id:id||crypto.randomUUID(),title:$('eventTitle').value.trim(),description:$('eventDescription').value.trim(),date:$('eventDate').value,start:$('eventStart').value,end:$('eventEnd').value,repeat:$('eventRepeat').value,location:$('eventLocation').value.trim(),people:$('eventPeople').value.trim(),notes:$('eventNotes').value.trim(),done:old?.done||false,tag:$('eventRepeat').value!=='none'?'Repeating':$('eventStart').value?'Timed':''};if(!item.title||!item.date)return;if(id)events=events.map(x=>x.id===id?item:x);else events.push(item);selected=parseDate(item.date);cursor=new Date(selected);persist();closeModal();renderAll();showToast(id?'Event updated':'Event added');$('eventForm').dataset.editId=''});
['prevYear','nextYear','prevMonth','nextMonth'].forEach(id=>$(id).addEventListener('click',()=>{const amount=id==='prevYear'?-12:id==='nextYear'?12:id==='prevMonth'?-1:1;cursor=new Date(cursor.getFullYear(),cursor.getMonth()+amount,1,12);selected=new Date(cursor.getFullYear(),cursor.getMonth(),Math.min(selected.getDate(),new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate()),12);renderCalendar()}));

$('searchInput').addEventListener('input',()=>{const q=$('searchInput').value.trim().toLowerCase();$('searchResults').innerHTML='';if(!q)return;const matches=events.filter(e=>(e.title+' '+e.description+' '+e.location+' '+e.date).toLowerCase().includes(q)).slice(0,20);let dateMatch=null;if(/\d{4}-\d{2}-\d{2}/.test(q))dateMatch=parseDate(q.match(/\d{4}-\d{2}-\d{2}/)[0]);else{const parsed=new Date(q);if(!Number.isNaN(parsed.getTime())&&q.length>5)dateMatch=new Date(parsed.getFullYear(),parsed.getMonth(),parsed.getDate(),12)}if(dateMatch){const b=document.createElement('button');b.className='small-btn';b.textContent='Go to '+fmtDate(dateMatch,{day:'numeric',month:'long',year:'numeric'});b.onclick=()=>{selected=dateMatch;cursor=new Date(dateMatch);$('searchResults').innerHTML='';$('searchInput').value='';renderCalendar()};$('searchResults').appendChild(b)}if(matches.length){const h=document.createElement('div');h.className='eyebrow';h.textContent='Matching events';$('searchResults').appendChild(h);const list=document.createElement('div');list.innerHTML=listMarkup(matches,'No matches');$('searchResults').appendChild(list);bindEventActions(list);list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openNormal(events.find(x=>x.id===b.dataset.edit))))}else if(!dateMatch)$('searchResults').innerHTML='<div class="empty">No matching events or dates.</div>'});
let handleY=0,handleX=0;const handle=$('selectedPanel').querySelector('.panel-handle');handle.addEventListener('pointerdown',e=>{handleY=e.clientY;handleX=e.clientX;handle.setPointerCapture?.(e.pointerId)});handle.addEventListener('pointerup',e=>{const dy=e.clientY-handleY,dx=e.clientX-handleX;if(Math.abs(dy)<28||Math.abs(dy)<Math.abs(dx))return;view=dy<0?(view==='all'?'month':view==='month'?'week':'week'):(view==='week'?'month':'all');renderCalendar()});let timelineBusy=false;$('calendarScroller').addEventListener('scroll',()=>{if(view!=='all'||timelineBusy)return;const sc=$('calendarScroller'),grid=$('dateGrid'),sections=grid.querySelectorAll('.timeline-month');if(!sections.length)return;const scRect=sc.getBoundingClientRect();let nearest=sections[0];for(const sec of sections){if(sec.getBoundingClientRect().top<=scRect.top+35)nearest=sec;else break}const shown=nearest.dataset.month.split('-').map(Number);cursor=new Date(shown[0],shown[1]-1,1,12);$('monthTitle').textContent=fmtDate(cursor,{month:'long',year:'numeric'});if(sc.scrollTop<160){timelineBusy=true;const first=sections[0],parts=first.dataset.month.split('-').map(Number),newMonth=new Date(parts[0],parts[1]-13,1,12),oldHeight=sc.scrollHeight;grid.insertAdjacentHTML('afterbegin',Array.from({length:12},(_,i)=>makeMonth(new Date(newMonth.getFullYear(),newMonth.getMonth()+i,1,12))).join(''));bindDateCells(grid);sc.scrollTop+=sc.scrollHeight-oldHeight;timelineBusy=false}else if(sc.scrollHeight-sc.scrollTop-sc.clientHeight<180){timelineBusy=true;const last=sections[sections.length-1],parts=last.dataset.month.split('-').map(Number),newMonth=new Date(parts[0],parts[1],1,12);grid.insertAdjacentHTML('beforeend',Array.from({length:12},(_,i)=>makeMonth(new Date(newMonth.getFullYear(),newMonth.getMonth()+i,1,12))).join(''));bindDateCells(grid);timelineBusy=false}}, {passive:true});let touchX=0,touchY=0;$('calendarScreen').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});$('calendarScreen').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25&&view!=='all'){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+(dx<0?1:-1),1,12);selected=new Date(cursor.getFullYear(),cursor.getMonth(),Math.min(selected.getDate(),new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate()),12);renderCalendar()}},{passive:true});

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
renderAll();
})();
