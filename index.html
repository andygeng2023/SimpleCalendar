<!DOCTYPE html>

<html>

<head>

<title>SimpleCalendar</title>

<link rel="stylesheet" type="text/css" href="styles.css">

</head>

<body>

    <h3 id="current-date"></h3>

    <script>
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = today.toLocaleDateString(undefined, options);
    </script>
    
    <h2>Sample h2 heading</h2>

    <p>Sample paragraph</p>

    <nav>
        <div class="navbar">
            <img href="/assets/images/navbar-home.svg" class="active" alt="Home"
            <img href="/assets/images/navbar-calendar.svg" alt="Calendar">
            <img href="/assets/images/navbar-addev.svg" alt="Add Event">
            <img href="/assets/images/navbar-settings.svg" alt="Settings">
        </div>
    </nav>
</body>
</html>
